<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c16">
  <title>CrewBIQ Next — Visual Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="../../navigation-model.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <section class="launch" id="launch" aria-label="CrewBIQ is loading">
    <div class="launch-grid" aria-hidden="true"></div>
    <div class="brand-mark brand-mark-large"><span class="mark-road"></span><span class="mark-pulse"></span></div>
    <div class="launch-brand">CREW<span>BIQ</span></div>
    <p>Fleet Intelligence Platform</p>
    <div class="launch-progress"><i></i></div>
    <button class="skip-launch" id="skipLaunch">Enter prototype</button>
  </section>

  <div class="prototype-banner"><span>Visual prototype</span><b>Read-only demo data</b></div>
  <div class="shell" id="shell" aria-hidden="true">
    <aside class="rail" aria-label="Primary navigation">
      <button class="rail-brand" data-route="home" aria-label="CrewBIQ home">
        <span class="brand-mark"><span class="mark-road"></span><span class="mark-pulse"></span></span>
        <strong>CREW<span>BIQ</span></strong>
      </button>
      <nav id="desktopNav" class="rail-nav"></nav>
      <div class="rail-bottom">
        <button class="rail-action" data-route="functions"><span data-icon="grid"></span><span>Functions</span></button>
        <button class="avatar-button" data-route="settings" aria-label="Open account preview"><span>IB</span><i></i></button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark"><span class="mark-road"></span><span class="mark-pulse"></span></span><strong>CREW<span>BIQ</span></strong></div>
        <div class="page-identity">
          <button class="back-button" id="backButton" aria-label="Go back"><span data-icon="back"></span></button>
          <div><span id="pageEyebrow">Fleet intelligence</span><h1 id="pageTitle">Today</h1></div>
        </div>
        <div class="top-actions">
          <button class="sync-pill" data-route="states"><i></i><span>Synced</span></button>
          <button class="icon-button" id="functionsButton" aria-label="Open Functions"><span data-icon="grid"></span></button>
          <div class="role-control" id="roleControl">
            <button class="workspace-role" id="roleToggle" aria-expanded="false" aria-controls="roleSwitch"><span>Prototype</span><strong id="currentRoleLabel">Driver</strong><i>⌄</i></button>
            <div class="role-switch" id="roleSwitch" aria-label="Prototype role"></div>
          </div>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Mobile primary navigation"></nav>
  </div>

  <div class="sheet-scrim" id="sheetScrim" aria-hidden="true"></div>
  <section class="quick-sheet" id="quickSheet" role="dialog" aria-modal="true" aria-labelledby="quickTitle" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-heading"><div><span>New record</span><h2 id="quickTitle">Quick Add</h2></div><button class="icon-button" id="closeQuick" aria-label="Close Quick Add"><span data-icon="close"></span></button></div>
    <div class="quick-grid" id="quickGrid"></div>
    <p class="prototype-note">Preview only. No production records are created.</p>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
